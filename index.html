<html lang="en">

<style>
/* Layout: NASA graphics-standards manual page on top, mission-control CRT screens (ticker + sports) set into it.
   Colour: nasa-red logo/rules, nasa-blue links, phosphor amber ticker, phosphor green sports screen. */
:root{
  --bg:#080B10; --fg:#E6E9EF; --muted:#8C96A6; --rule:#232B38;
  --red:#FC3D21; --blue:#4F7FDB; --link:#7FA8F0; --visited:#A592CC;
  --hover:#121823; color-scheme:dark;
  --crt-bg:#06100B; --crt-fg:#5CFFA1; --crt-dim:#2E8F5E; --crt-line:#12402A;
  --amber-bg:#140D02; --amber:#FFB000; --amber-dim:#9A6A00;
  --display:'Archivo','Helvetica Neue',Helvetica,Arial,sans-serif;
  --crt:'VT323','Courier New',monospace;
}
:root[data-mode="light"]{--bg:#F3F4F6; --fg:#14181F; --muted:#5B6472; --rule:#C9CED6; --blue:#0B3D91; --link:#0B3D91; --visited:#6B5A8E; --hover:#E7EAF0; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;line-height:1.35;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.wrap{max-width:none;margin:0 auto}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* banner */
.banner{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;
  padding:20px 0 12px;border-bottom:4px solid var(--blue)}
.logo{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(44px,8.5vw,68px);letter-spacing:-.025em;line-height:.95;color:var(--red);
  background:linear-gradient(to bottom,var(--red) 0 66%,#711B0F 66% 100%) 0 0/100% .067em;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:6px}
.stamp{text-align:right;font-family:var(--crt);font-size:24px;line-height:1.05;color:var(--fg)}
.stamp small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stamp .utc{color:var(--red)}
.mode{margin-top:8px;font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--fg);background:none;border:1px solid var(--rule);padding:4px 10px;cursor:pointer}
.mode:hover{background:var(--hover)}

/* ticker */
.ticker{display:flex;align-items:stretch;background:var(--amber-bg);color:var(--amber);border-bottom:3px solid var(--red);overflow:hidden}
.ticker .lbl{flex:none;display:flex;align-items:center;padding:0 12px;background:var(--amber);color:var(--amber-bg);
  font-family:var(--display);font-weight:900;font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.ticker .view{flex:1;min-width:0;overflow:hidden;position:relative}
.ticker .track{display:inline-flex;white-space:nowrap;padding:5px 0;font-family:var(--crt);font-size:24px;line-height:1.1;animation:roll 190s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.ticker a{color:var(--amber)}
.ticker .seg{padding-right:3em}
.ticker .sep{color:var(--amber-dim);padding:0 .6em}
@keyframes roll{to{transform:translateX(-50%)}}

/* main */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;margin-top:20px;align-items:start}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:6px;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.sec-h b{color:var(--link)}
ol.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:2.2em minmax(0,1fr);column-gap:6px;padding:6px 6px;border-radius:2px}
.feed li:hover{background:var(--hover)}
.feed .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;font-size:13px;padding-top:2px}
.feed .t{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.feed .t:visited{color:var(--visited)}
.feed .m{font-size:12px;color:var(--muted);margin-top:1px}
.grp+.grp{margin-top:28px}
.empty{margin:8px 6px;color:var(--muted);font-size:14px}
.note{margin-top:22px;padding:8px 10px;border:1px dashed var(--red);font-size:12px;color:var(--muted)}
.note b{color:var(--red)}
.sync{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule)}
.sync button{font:inherit;color:var(--link);background:none;border:1px solid var(--rule);padding:2px 8px;cursor:pointer;margin-left:6px}
.sync button:hover{background:var(--hover)}
.sync input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--rule);padding:3px 6px;width:min(320px,100%);margin:6px 6px 0 0}
.sync .err{color:var(--red)}
.sync ol{margin:6px 0 0 18px;padding:0}

/* sports screen */
.screen{background:var(--crt-bg);color:var(--crt-fg);border:3px solid var(--blue);border-radius:6px;
  font-family:var(--crt);font-size:21px;line-height:1.15;position:sticky;top:12px;overflow:hidden}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
.scr-h{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--crt-fg);color:var(--crt-bg);font-size:22px;letter-spacing:.06em}
.scr-b{padding:10px 12px 8px;min-height:430px}
.flag{font-size:16px;color:var(--amber);letter-spacing:.08em;margin-bottom:8px}
.blk{border-top:1px solid var(--crt-line);padding:6px 0}
.blk:first-of-type{border-top:0}
.k{color:var(--crt-dim);font-size:17px;letter-spacing:.1em;text-transform:uppercase}
.v{font-size:22px}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:1px 0}
.tbl td:first-child{width:1.8em;color:var(--crt-dim)}
.tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl td.num{text-align:right;width:2.4em}
.tbl.tight{font-size:18px;line-height:1}
.tbl tr.hl td{background:var(--crt-line);color:var(--crt-fg)}
.score{color:var(--amber)}
.foot{border-top:1px solid var(--crt-line);margin-top:6px;padding-top:6px;font-size:15px;color:var(--crt-dim);letter-spacing:.06em}
.dots{display:flex;gap:6px;justify-content:center;padding:6px 0 8px;position:relative;z-index:1}
.dots button{font-family:var(--crt);font-size:18px;color:var(--crt-dim);background:none;border:1px solid var(--crt-line);padding:0 10px;cursor:pointer;line-height:1.3}
.dots button[aria-current="true"]{color:var(--crt-bg);background:var(--crt-fg);border-color:var(--crt-fg)}
.bar{height:3px;background:var(--crt-line)}
.bar i{display:block;height:100%;width:0;background:var(--crt-fg)}

@media (min-width:1400px){
  .cols{grid-template-columns:minmax(0,1fr) 380px}
  #news{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 32px;align-items:start}
  .grp+.grp{margin-top:0}
}
@media (max-width:820px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .screen{position:static}
  .scr-b{min-height:0}
  .stamp{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  .ticker .track{animation:none}
  .ticker .view{overflow-x:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="banner">
    <div>
      <h1 class="logo">ACnet</h1>
      <div class="tag">Aerospace &amp; space news aggregator</div>
    </div>
    <div class="stamp">
      <small>Date</small>
      <span id="date">MONDAY 02 NOVEMBER 2026</span><br>
      <span class="utc" id="clock">DAY 306 / 00:00:00 UTC</span><br>
      <button type="button" class="mode" id="mode" aria-label="Switch colour scheme">Mode: dark</button>
    </div>
  </header>

  <div class="ticker" role="marquee" aria-label="Latest Jonathan's Space Report">
    <div class="lbl" id="jsrlbl">JSR 861</div>
    <div class="view"><div class="track" id="track"></div></div>
  </div>

  <div class="cols">
    <main>
      <div id="news"></div>
      <p class="note"><b>ACnet.</b> Headlines refresh daily and show the 15 newest unread per section. Opening a story hides it on this device. Sports and the ticker refresh daily.</p>
      <div class="note sync" id="sync"></div>
    </main>

    <aside aria-label="Sports">
      <section class="screen" id="screen">
        <div class="scr-h"><span id="st">FORMULA 1</span><span id="sp">1/3</span></div>
        <div class="scr-b" id="sb"></div>
        <div class="bar"><i id="prog"></i></div>
        <div class="dots" id="dots"></div>
      </section>
    </aside>
  </div>
</div>

<script>
/* ---------- DATA (swap these objects for live feeds later) ---------- */
var JSR = {
  issue: "JSR 861", date: "2026 Nov 1", url: "https://planet4589.org/space/jsr/jsr.html",
  items: [
    "ISS Expedition 75 under way: Crew-13 Dragon docked Oct 1, Crew-12 landed Oct 8",
    "Cygnus NG-24 unberthed Oct 9 and burned up over the South Pacific Oct 12",
    "Dragon CRS-35 docked Oct 15 carrying two IROSA solar arrays; EVA-100 on Oct 29 installed the 2A array on P4",
    "Falcon Heavy launched NROL-97 from KSC on Oct 2",
    "21 SDA Tranche 1 Transport Layer satellites launched Oct 10; USSF-481 flew Oct 16",
    "Starlink Group 15 launches on Oct 13, 23, 27 and 31 from Vandenberg",
    "Transporter 18 (Oct 1) and Bandwagon 5 (Oct 20) rideshares flew",
    "JAXA H3 launched the MMX Phobos sample-return probe Oct 19; it left Earth's Hill sphere Oct 24; capsule due back at Woomera in 2031",
    "China: Xingwang batches on CZ-12 and CZ-8A, Yaogan 50, 53 and 56 launches, Landspace Zhuque-2E orbital computing sats",
    "Rocket Lab Electron launched three Hawk sigint satellites Oct 23",
    "ISRO GSLV Mk II put NVS-03 into geotransfer orbit Oct 30",
    "Starship V3 test flight with Ship 41 on Sep 28"
  ]
};

/* All sports content is SAMPLE until a live feed is connected. */
var SPORTS = [
  { code:"F1", title:"FORMULA 1", sample:true,
    next:["Sao Paulo Grand Prix","08 Nov 2026","Interlagos, Brazil"],
    last:["Mexico City Grand Prix","25 Oct 2026","Autodromo Hermanos Rodriguez"],
    podiumLabel:"LAST RACE PODIUM", podium:["DRIVER A","DRIVER B","DRIVER C"],
    tableLabel:"DRIVERS CHAMPIONSHIP", table:[["DRIVER A","000"],["DRIVER B","000"],["DRIVER C","000"],["DRIVER D","000"],["DRIVER E","000"],["DRIVER F","000"],["DRIVER G","000"],["DRIVER H","000"]] },
  { code:"WEC", title:"WEC", sample:true,
    next:["Bahrain 8 Hours","07 Nov 2026","Sakhir, Bahrain"],
    last:["Fuji 6 Hours","27 Sep 2026","Fuji Speedway, Japan"],
    podiumLabel:"LAST RACE PODIUM", podium:["TEAM A","TEAM B","TEAM C"],
    tableLabel:"TEAMS CHAMPIONSHIP", table:[["TEAM A","000"],["TEAM B","000"],["TEAM C","000"],["TEAM D","000"],["TEAM E","000"],["TEAM F","000"],["TEAM G","000"],["TEAM H","000"]] },
  { code:"AC", title:"AMERICA'S CUP", sample:true,
    next:["Regatta TBC","TBC","TBC"],
    last:["Regatta TBC","TBC","TBC"],
    podiumLabel:null, podium:null,
    tableLabel:"CURRENT STANDINGS", table:[["SYNDICATE A","0"],["SYNDICATE B","0"],["SYNDICATE C","0"],["SYNDICATE D","0"],["SYNDICATE E","0"]] },
  { code:"LFC", title:"LIVERPOOL FC", sample:true,
    nextLabel:"NEXT MATCH", lastLabel:"LAST MATCH",
    next:["OPPONENT TBC","DATE TBC","VENUE TBC · H/A"],
    last:["OPPONENT TBC","DATE TBC","VENUE TBC · H/A"], score:"FT  0 - 0",
    podiumLabel:null, podium:null,
    tableLabel:"PREMIER LEAGUE  (PLD / PTS)", table:[
      ["CLUB A","00","00"],["CLUB B","00","00"],["LIVERPOOL","00","00","hl"],["CLUB D","00","00"],["CLUB E","00","00"],
      ["CLUB F","00","00"],["CLUB G","00","00"],["CLUB H","00","00"],["CLUB I","00","00"],["CLUB J","00","00"],
      ["CLUB K","00","00"],["CLUB L","00","00"],["CLUB M","00","00"],["CLUB N","00","00"],["CLUB O","00","00"],
      ["CLUB P","00","00"],["CLUB Q","00","00"],["CLUB R","00","00"],["CLUB S","00","00"],["CLUB T","00","00"]] }
];

/* ---------- RENDER ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

// colour scheme toggle (opens in dark unless the viewer chose otherwise)
(function(){
  var root=document.documentElement, btn=document.getElementById("mode"), mode="dark";
  try{var s=localStorage.getItem("acnet-mode"); if(s==="light"||s==="dark")mode=s}catch(e){}
  function apply(){root.setAttribute("data-mode",mode);btn.textContent="Mode: "+mode}
  btn.addEventListener("click",function(){
    mode=mode==="dark"?"light":"dark"; apply();
    try{localStorage.setItem("acnet-mode",mode)}catch(e){}
  });
  apply();
})();

// date + clock
var DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
var MONTHS=["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
function p2(n){return (n<10?"0":"")+n}
function tick(){
  var d=new Date();
  document.getElementById("date").textContent=DAYS[d.getDay()]+" "+p2(d.getDate())+" "+MONTHS[d.getMonth()]+" "+d.getFullYear();
  var start=Date.UTC(d.getUTCFullYear(),0,0), doy=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-start)/864e5);
  document.getElementById("clock").textContent="DAY "+doy+" / "+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes())+":"+p2(d.getUTCSeconds())+" UTC";
}
tick(); setInterval(tick,1000);

// ticker
function renderTicker(){
  document.getElementById("jsrlbl").textContent=JSR.issue+" · "+JSR.date.toUpperCase();
  var seg='<span class="seg">'+JSR.items.map(function(t){return '<a href="'+JSR.url+'" target="_blank" rel="noopener">'+esc(t.toUpperCase())+'</a>'}).join('<span class="sep">◆</span>')+'<span class="sep">◆</span></span>';
  document.getElementById("track").innerHTML=seg+seg;
  var n=0; JSR.items.forEach(function(t){n+=t.length});
  document.getElementById("track").style.animationDuration=Math.max(60,Math.round(n*.17))+"s";
}
renderTicker();

// ---------- NEWS: three groups, 15 unread each, stories vanish once opened ----------
var GROUPS=[["science","SCIENCE AND TECHNOLOGY"],["space","SPACE"],["motorsport","MOTORSPORT"]];
var NEWS={science:null,space:null,motorsport:null};
var PER_GROUP=15, readMap={}, readRef=null, saveTimer=null, saving=false, dirty=false;
function h53(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
try{var _r=JSON.parse(localStorage.getItem("acnet-read")||"{}"); if(_r&&typeof _r==="object") readMap=_r}catch(e){}
function keyOf(it){var t=it.d?Date.parse(it.d):Date.parse(it.f||""); return isNaN(t)?0:t}
function ageOf(it){
  var t=keyOf(it); if(!t) return "";
  var m=Math.max(0,(Date.now()-t)/60000);
  if(it.d&&String(it.d).length<=10){var dd=Math.floor(m/1440); return dd<1?"today":dd+"d ago"}
  if(m<60) return Math.round(m)+"m ago";
  if(m<1440) return Math.round(m/60)+"h ago";
  return Math.floor(m/1440)+"d ago";
}
function renderNews(){
  var html="";
  GROUPS.forEach(function(g){
    var doc=NEWS[g[0]], items=((doc&&doc.items)||[]).filter(function(it){return it&&it.u&&it.t&&/^https?:\/\//.test(it.u)});
    var unread=items.filter(function(it){return !readMap[h53(it.u)]}).sort(function(a,b){return keyOf(b)-keyOf(a)});
    var show=unread.slice(0,PER_GROUP);
    html+='<section class="grp"><div class="sec-h"><b>'+esc(g[1])+'</b><span>'+unread.length+' unread</span></div>';
    if(!show.length){ html+='<p class="empty">'+(doc?'All caught up.':'No headlines yet.')+'</p>' }
    else{
      html+='<ol class="feed">'+show.map(function(it,i){
        var a=ageOf(it);
        return '<li><span class="n">'+(i+1)+'.</span><div><a class="t" href="'+esc(it.u)+'" target="_blank" rel="noopener" data-k="'+h53(it.u)+'">'+esc(it.t)+'</a><div class="m">('+esc(it.s||"")+')'+(a?' · '+a:'')+'</div></div></li>';
      }).join("")+'</ol>';
    }
    html+='</section>';
  });
  document.getElementById("news").innerHTML=html;
}
function pruneRead(){
  var ks=Object.keys(readMap), cutoff=Date.now()-120*864e5;
  ks.forEach(function(k){ if(readMap[k]<cutoff) delete readMap[k] });
  ks=Object.keys(readMap);
  if(ks.length>3000){ ks.sort(function(a,b){return readMap[b]-readMap[a]}).slice(3000).forEach(function(k){delete readMap[k]}) }
}
function flushRead(){
  if(!readRef) return;
  if(saving){ dirty=true; return }
  saving=true; dirty=false;
  readRef.set({m:readMap,updated:new Date().toISOString()}).catch(function(){}).then(function(){ saving=false; if(dirty) flushRead() });
}
function persistRead(){
  pruneRead();
  try{localStorage.setItem("acnet-read",JSON.stringify(readMap))}catch(e){}
  if(readRef){ clearTimeout(saveTimer); saveTimer=setTimeout(flushRead,600) }
  if(SYNC.on()) SYNC.later();
}
function markRead(k){
  if(!k||readMap[k]) return;
  readMap[k]=Date.now(); persistRead();
  setTimeout(renderNews,250);
}
(function(){
  var el=document.getElementById("news");
  function onOpen(e){var a=e.target.closest&&e.target.closest("a.t"); if(a) markRead(a.getAttribute("data-k"))}
  el.addEventListener("click",onOpen);
  el.addEventListener("auxclick",onOpen);
})();
function getJSON(u){return fetch(u+"?v="+Math.floor(Date.now()/600000),{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()})}
function startNews(){
  GROUPS.forEach(function(g){ getJSON("data/news-"+g[0]+".json").then(function(d){NEWS[g[0]]=d;renderNews()}).catch(function(){}) });
}
renderNews();

// ---------- SYNC: read list shared between devices through one private GitHub Gist ----------
var SYNC=(function(){
  var KEY="acnet-sync", DESC="ACnet read state", FILE="acnet-read.json", API="https://api.github.com";
  var cfg=null, busy=false, again=false, timer=null, status="", err="", last="", open=false;
  try{cfg=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  function save(){try{if(cfg)localStorage.setItem(KEY,JSON.stringify(cfg));else localStorage.removeItem(KEY)}catch(e){}}
  function hdr(){return {"Authorization":"Bearer "+cfg.t,"Accept":"application/vnd.github+json"}}
  function api(path,opt){
    opt=opt||{}; opt.headers=Object.assign(hdr(),opt.headers||{}); opt.cache="no-store";
    return fetch(API+path,opt).then(function(r){
      if(r.status===401||r.status===403) throw new Error("TOKEN REJECTED");
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
  }
  function findGist(){
    return api("/gists?per_page=100").then(function(list){
      for(var i=0;i<list.length;i++){ if(list[i].description===DESC&&list[i].files&&list[i].files[FILE]) return list[i].id }
      return null;
    });
  }
  function ensureGist(){
    if(cfg.g) return Promise.resolve(cfg.g);
    return findGist().then(function(id){
      if(id){cfg.g=id;save();return id}
      var f={}; f[FILE]={content:JSON.stringify({m:{}})};
      return api("/gists",{method:"POST",body:JSON.stringify({description:DESC,public:false,files:f})}).then(function(g){cfg.g=g.id;save();return g.id});
    });
  }
  function readRemote(id){
    return api("/gists/"+id).then(function(g){
      var f=g.files&&g.files[FILE]; if(!f) return {};
      var p=f.truncated?fetch(f.raw_url,{cache:"no-store"}).then(function(r){return r.text()}):Promise.resolve(f.content);
      return p.then(function(t){var d={};try{d=JSON.parse(t)}catch(e){} return (d&&d.m)||{}});
    });
  }
  function run(){
    if(!cfg) return Promise.resolve();
    if(busy){again=true;return Promise.resolve()}
    busy=true; status="SYNCING"; err=""; draw();
    return ensureGist().then(function(id){
      return readRemote(id).then(function(remote){
        var merged={},k,changedLocal=false,changedRemote=false;
        for(k in readMap) merged[k]=readMap[k];
        for(k in remote){ if(!merged[k]||remote[k]>merged[k]) merged[k]=remote[k] }
        for(k in merged){ if(readMap[k]!==merged[k]) changedLocal=true; if(remote[k]!==merged[k]) changedRemote=true }
        readMap=merged; pruneRead();
        try{localStorage.setItem("acnet-read",JSON.stringify(readMap))}catch(e){}
        if(changedLocal) renderNews();
        if(!changedRemote) return;
        return api("/gists/"+id,{method:"PATCH",body:JSON.stringify({files:(function(){var o={};o[FILE]={content:JSON.stringify({m:readMap,updated:new Date().toISOString()})};return o})()})});
      });
    }).then(function(){
      var d=new Date(); last=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); status="OK";
    }).catch(function(e){ status="ERROR"; err=(e&&e.message)||"FAILED"; })
    .then(function(){ busy=false; draw(); if(again){again=false; later()} });
  }
  function later(){clearTimeout(timer); timer=setTimeout(run,2500)}
  function connect(tok){
    tok=(tok||"").replace(/\s+/g,"");
    if(!tok){err="PASTE A TOKEN";draw();return}
    cfg={t:tok,g:null}; save(); open=false; run();
  }
  function off(){cfg=null;save();status="";err="";last="";draw()}
  function draw(){
    var el=document.getElementById("sync"); if(!el) return;
    var h="";
    if(cfg){
      h='<b>SYNC</b> '+(status==="ERROR"?'<span class="err">error: '+err+'</span>':status==="SYNCING"?'syncing…':'on'+(last?' · synced '+last:''))+
        ' <button type="button" data-a="now">Sync now</button><button type="button" data-a="off">Turn off</button>';
    }else{
      h='<b>SYNC</b> off <button type="button" data-a="setup">Set up</button>';
      if(open){
        h+='<ol><li>On GitHub: Settings, Developer settings, Personal access tokens, Tokens (classic), Generate new token (classic).</li>'+
           '<li>Tick only <b>gist</b>, set no expiry, generate, copy the token.</li>'+
           '<li>Paste it here (use the same token on every device):</li></ol>'+
           '<input id="synctok" type="password" autocomplete="off" placeholder="ghp_..."><button type="button" data-a="go">Connect</button>'+
           (err?' <span class="err">'+err+'</span>':'');
      }
    }
    el.innerHTML=h;
  }
  document.addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("#sync button"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="setup"){open=true;err="";draw()}
    else if(a==="go"){connect((document.getElementById("synctok")||{}).value)}
    else if(a==="now"){run()}
    else if(a==="off"){off()}
  });
  document.addEventListener("visibilitychange",function(){ if(!document.hidden&&cfg) run() });
  setInterval(function(){ if(cfg&&!document.hidden) run() },5*60*1000);
  return {on:function(){return !!cfg},later:later,run:run,draw:draw};
})();
SYNC.draw(); if(SYNC.on()) SYNC.run();

// sports rotator
var cur=0, paused=false, DWELL=9000, t0=Date.now(), timer=null;
var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function tblRows(t){return t.map(function(r,i){
  var hl=r[r.length-1]==="hl", v=r.slice(1,hl?r.length-1:r.length);
  return '<tr'+(hl?' class="hl"':'')+'><td>'+(i+1)+'</td><td style="text-align:left">'+esc(r[0])+'</td>'+v.map(function(x){return '<td class="num">'+esc(x)+'</td>'}).join("")+'</tr>'}).join("")}
function block(k,rows){return '<div class="blk"><div class="k">'+k+'</div>'+rows+'</div>'}
function draw(){
  var s=SPORTS[cur];
  document.getElementById("st").textContent=s.title;
  document.getElementById("sp").textContent=(cur+1)+"/"+SPORTS.length;
  var h=(s.sample?'<div class="flag">** SAMPLE DATA – FEED NOT CONNECTED **</div>':'');
  h+=block(s.nextLabel||"NEXT RACE",'<div class="v">'+esc(s.next[0])+'</div><div>'+esc(s.next[1])+'</div><div>'+esc(s.next[2])+'</div>');
  h+=block(s.lastLabel||"LAST RACE",'<div class="v">'+esc(s.last[0])+'</div><div>'+esc(s.last[1])+'</div><div>'+esc(s.last[2])+'</div>'+(s.score?'<div class="v score">'+esc(s.score)+'</div>':''));
  if(s.podium){h+=block(s.podiumLabel,'<table class="tbl">'+s.podium.map(function(p,i){return '<tr><td>P'+(i+1)+'</td><td>'+esc(p)+'</td></tr>'}).join("")+'</table>')}
  if(s.table&&s.table.length){h+=block(s.tableLabel,'<table class="tbl'+(s.table.length>10?' tight':'')+'">'+tblRows(s.table)+'</table>')}
  else if(s.note){h+=block(s.tableLabel,'<div style="font-size:19px">'+esc(s.note)+'</div>')}
  if(s.updated){var u=new Date(s.updated);if(!isNaN(u)){h+='<div class="foot">UPDATED '+p2(u.getUTCDate())+' '+MONTHS[u.getUTCMonth()].slice(0,3)+' '+p2(u.getUTCHours())+':'+p2(u.getUTCMinutes())+' UTC'+(s.source?' · '+esc(s.source):'')+'</div>'}}
  document.getElementById("sb").innerHTML=h;
  var d=document.getElementById("dots");
  d.innerHTML=SPORTS.map(function(x,i){return '<button type="button" data-i="'+i+'"'+(i===cur?' aria-current="true"':'')+' aria-label="Show '+esc(x.title)+'">'+x.code+'</button>'}).join("");
  t0=Date.now();
}
document.getElementById("dots").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return; cur=+b.getAttribute("data-i"); draw();
});
var scr=document.getElementById("screen");
["mouseenter","focusin"].forEach(function(ev){scr.addEventListener(ev,function(){paused=true})});
["mouseleave","focusout"].forEach(function(ev){scr.addEventListener(ev,function(){paused=false;t0=Date.now()})});
draw();

// live data: committed daily as JSON files in /data
function loadLive(){
  startNews();
  getJSON("data/sports.json").then(function(all){
    var changed=false;
    Object.keys(all).forEach(function(id){
      var code=id.toUpperCase();
      for(var i=0;i<SPORTS.length;i++){ if(SPORTS[i].code===code){ Object.assign(SPORTS[i],all[id],{sample:false}); changed=true } }
    });
    if(changed) draw();
  }).catch(function(){});
  getJSON("data/ticker.json").then(function(x){
    if(x&&x.issue&&x.date&&x.items&&x.items.length){
      JSR={issue:String(x.issue),date:String(x.date),
           url:String(x.url||"").indexOf("https://planet4589.org/")===0?x.url:JSR.url,
           items:x.items.map(String)};
      renderTicker();
    }
  }).catch(function(){});
}
loadLive(); setInterval(loadLive,30*60*1000);

if(!reduce){
  setInterval(function(){
    var el=Date.now()-t0;
    if(paused){document.getElementById("prog").style.width="0";return}
    document.getElementById("prog").style.width=Math.min(100,el/DWELL*100)+"%";
    if(el>=DWELL){cur=(cur+1)%SPORTS.length;draw()}
  },100);
}
</script>
